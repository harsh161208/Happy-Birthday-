<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Madam ji!</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .card {
            background: linear-gradient(145deg, #1e1e24, #121216);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255, 64, 129, 0.25);
            max-width: 450px;
            margin: 0 auto;
            border: 1px solid rgba(255, 64, 129, 0.2);
        }
        h1 {
            color: #ff4081;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.5rem;
            color: #ff80ab;
            font-weight: bold;
            margin-top: 0;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #e0e0e0;
        }
        .emoji {
            font-size: 2.5rem;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🎉✨</div>
        <h1>Happy Birthday</h1>
        <div class="subtitle">Madam ji! 🎂</div>
        <p>Aapko janmdin ki bahut bahut badhaiyan!</p>
        <p>Ye saal aapke liye dher sari khushiyan, safalta aur aachi health lekar aaye. Hamesha aise hi muskurate rahiye! 🌟</p>
    </div>
</body>
</html>
